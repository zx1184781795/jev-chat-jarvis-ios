name: Build iOS IPA (unsigned)

# 给没有 Mac 的人用：在 GitHub 的 macOS runner 上编译出未签名 ipa，
# 再拿回 Windows 用 Sideloadly 签上自己的 Apple ID 装进 iPhone。
#
# 不做任何签名/公证，因此不需要证书、不需要 Apple 账号、不需要付费会员。
#
# 这是「任何人 fork 后一键出包」的自助入口，所以它的编译/打包逻辑与
# release.yml 共用 scripts/ci/build_ipa.sh —— 一套逻辑，两处触发，
# 不存第二份拷贝（否则改一处忘一处，迟早漂移）。
#
# 详细图文手册见 docs/CLOUD-BUILD.md。

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 构建配置
        type: choice
        options:
          - Release
          - Debug
        default: Release
      uniquify_bundle_id:
        description: 把 Bundle ID / App Group 改写成 <你的 GitHub 用户名>，避开原作者可能已占用的 App ID
        type: boolean
        default: true
      adhoc_sign:
        description: 构建后做 ad-hoc 签名，把 App Group 权限写进签名（提升重签后键盘读到配置的成功率）
        type: boolean
        default: true
  push:
    paths:
      - '.github/workflows/build-ios-unsigned.yml'
      - 'scripts/ci/**'   # 脚本改了也要重跑，否则改坏了没人知道

permissions:
  contents: write   # 要把产物 / 日志推到 builds、ci-log 分支

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    env:
      CONFIG: ${{ inputs.configuration || 'Release' }}
      ADHOC_SIGN: ${{ github.event_name == 'push' && '1' || (inputs.adhoc_sign && '1' || '0') }}
      UNIQUIFY: ${{ github.event_name == 'push' && '1' || (inputs.uniquify_bundle_id && '1' || '0') }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 打印工具链版本
        run: |
          set -x
          sw_vers
          xcodebuild -version
          xcode-select -p
          find /Applications -maxdepth 1 -name 'Xcode*.app' -print 2>/dev/null || true
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: 列出工程可用的 target / scheme
        run: xcodebuild -list -project JevJarvis.xcodeproj || true

      # App ID 在 Apple 侧全局唯一。直接用原作者的前缀会撞上他已注册的
      # com.jevchat.jarvis，签名时报 "identifier is not available"。
      # 这里换成你自己的；改完脚本会做一致性断言，不一致就停在构建之前。
      - name: 改写 Bundle ID 与 App Group
        if: env.UNIQUIFY == '1'
        env:
          HANDLE: ${{ github.actor }}
        run: python3 scripts/ci/uniquify_bundle_id.py --handle "$HANDLE"

      - name: 工程一致性校验
        run: python3 scripts/ci/verify_project.py

      - name: 编译 + ad-hoc 签名 + 打包
        run: bash scripts/ci/build_ipa.sh

      # 免电脑签名（Feather / ESign / SideStore / TrollStore）都要求「ipa 先在手机上」。
      # Actions 产物下载必须登录 GitHub，手机浏览器上很别扭；推到 builds 分支后
      # 一条 raw 链接 Safari 直接就能下。
      - name: 把 ipa 推到 builds 分支（手机端可直接下载）
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/push_to_branch.sh builds JevJarvis-unsigned.ipa build-info.txt

      # 没有 Mac 的人看不到 Actions 日志（下载日志要登录 GitHub）。
      # 把日志推回一个分支，任何人一条 curl 就能读，排查不用来回问。
      - name: 确保日志文件存在
        if: always()
        run: |
          [ -s build.log ] || echo "(本次没有产生 build.log)" > build.log
          [ -f build-info.txt ] || echo "(本次没有产生 build-info.txt)" > build-info.txt

      - name: 把构建日志推到 ci-log 分支（便于远程诊断）
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/push_to_branch.sh ci-log build.log build-info.txt JevJarvis-unsigned.ipa

      - name: 汇总
        if: always()
        run: |
          {
            echo "### 未签名 ipa"
            echo ""
            if [ -f build-info.txt ]; then
              echo '```'
              cat build-info.txt
              echo '```'
            fi
            echo ""
            echo "手机 Safari 直接下载："
            echo "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/builds/JevJarvis-unsigned.ipa"
          } >> "$GITHUB_STEP_SUMMARY"

